# Same checks as the local workflow (CLAUDE.md "Comandos"), against a real Postgres:
# concurrency and constraint tests need real locks, not a mock.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: elevate
          POSTGRES_PASSWORD: elevate
          POSTGRES_DB: elevate_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U elevate -d elevate_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      # Throwaway CI database, not a secret.
      TEST_DATABASE_URL: postgres://elevate:elevate@localhost:5432/elevate_test
      NEXT_TELEMETRY_DISABLED: '1'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Formatting
        run: npm run format:check

      # API (unit, integration, concurrency; migrations run in the Vitest global setup)
      # and web (pure functions).
      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

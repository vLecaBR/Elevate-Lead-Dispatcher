# Values come from .env when present; the defaults below let `docker compose up` work without it.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-elevate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-elevate}
      POSTGRES_DB: ${POSTGRES_DB:-elevate}
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot: applies migrations (and the demo seed when SEED_DEMO=true), then exits.
  # Same image as the api, so the migrations shipped are exactly the ones the code expects.
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: elevate-lead-dispatcher-api
    command:
      - sh
      - -c
      - node apps/api/dist/db/migrate.js && if [ "$$SEED_DEMO" = true ]; then node apps/api/dist/db/seed.js; fi
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-elevate}:${POSTGRES_PASSWORD:-elevate}@db:5432/${POSTGRES_DB:-elevate}
      SEED_DEMO: ${SEED_DEMO:-true}
    restart: 'no'
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: elevate-lead-dispatcher-api
    environment:
      NODE_ENV: production
      API_HOST: 0.0.0.0
      API_PORT: 3001
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Inside the compose network the database host is the service name, not localhost.
      DATABASE_URL: postgres://${POSTGRES_USER:-elevate}:${POSTGRES_PASSWORD:-elevate}@db:5432/${POSTGRES_DB:-elevate}
      APP_TIMEZONE: ${APP_TIMEZONE:-America/Sao_Paulo}
      DEFAULT_PHONE_REGION: ${DEFAULT_PHONE_REGION:-BR}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-8}
      # Local stack runs on plain http; production must keep the secure default (true).
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
      WEBHOOK_TOLERANCE_SECONDS: ${WEBHOOK_TOLERANCE_SECONDS:-300}
      DISPATCH_LOCK_TIMEOUT_MS: ${DISPATCH_LOCK_TIMEOUT_MS:-3000}
      RATE_LIMIT_GLOBAL_PER_MIN: ${RATE_LIMIT_GLOBAL_PER_MIN:-300}
      RATE_LIMIT_LEADS_PER_MIN: ${RATE_LIMIT_LEADS_PER_MIN:-60}
      RATE_LIMIT_WEBHOOK_PER_MIN: ${RATE_LIMIT_WEBHOOK_PER_MIN:-120}
      # Browser calls arrive through the Next.js rewrite, which does not pass the client IP,
      # so per-IP limits see the web container as one client: the login limit is raised and
      # the per-account lockout (5 failures -> 15 min) is the brute-force defense. Not trusted
      # as a proxy on purpose: Next forwards client-sent X-Forwarded-For untouched.
      RATE_LIMIT_LOGIN_PER_MIN: ${RATE_LIMIT_LOGIN_PER_MIN:-30}
      # Set to the edge proxy (nginx/ALB) that overwrites X-Forwarded-For, in production.
      TRUST_PROXY: ${TRUST_PROXY:-}
    ports:
      - '${API_PORT:-3001}:3001'
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:3001/ready || exit 1']
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - '${WEB_PORT:-3000}:3000'
    depends_on:
      api:
        condition: service_healthy

volumes:
  db-data:
